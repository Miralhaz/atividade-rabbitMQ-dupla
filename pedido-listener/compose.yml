services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pedido-network

  postgres:
    image: postgres:16-alpine
    container_name: postgres-pedidos
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pedidos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pedidos_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pedido-network

  app:
    build: .
    container_name: pedido-listener
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=admin
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=pedidos_db
      - DB_USER=postgres
      - DB_PASS=postgres
      - NODE_ENV=production
    networks:
      - pedido-network
    restart: unless-stopped

volumes:
  rabbitmq_data:
  postgres_data:

networks:
  pedido-network:
    driver: bridge
